<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1016" viewBox="0 0 720 1016" role="img" aria-labelledby="title description">
  <title id="title">QuickAssist 交互与上下文数据流</title>
  <desc id="description">页面划词或主动激活后，可先显示智能帮助入口，也可直接打开输入浮层。上下文依次经过基础字段、附近文本、可选业务字段和可选脱敏处理。上下文就绪后可点击推荐项，或手动输入并发送，无须等待远程推荐完成。随后由 buildPrompt 构造最终问题，关闭浮层并通过 adapter.submit 将请求交给应用已有的对话面板。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #183153; }
      .label { font-size: 22px; font-weight: 600; }
      .detail { font-size: 18px; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 17px; fill: #334155; }
      .small-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; letter-spacing: -0.3px; fill: #334155; }
      .step { fill: #f5f8ff; stroke: #b4c7e7; stroke-width: 1.5; }
      .branch { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .optional { fill: #eef9f5; stroke: #a6d6c5; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="1014" rx="20" fill="#fff" stroke="#dbe3ed"/>

  <rect class="step" x="180" y="24" width="360" height="80" rx="12"/>
  <text class="label" x="360" y="55">页面划词或主动激活</text>
  <text class="code" x="360" y="83">activate() / registerSource()</text>
  <path class="flow" d="M360 104 V120 H186 V142"/>
  <path class="flow" d="M360 120 H534 V142"/>

  <rect class="branch" x="36" y="144" width="300" height="100" rx="12"/>
  <text class="label" x="186" y="175">显示“智能帮助”入口</text>
  <text class="detail" x="186" y="204">默认流程</text>
  <text class="detail" x="186" y="230">点击入口继续</text>
  <rect class="branch" x="384" y="144" width="300" height="100" rx="12"/>
  <text class="label" x="534" y="175">直接打开输入浮层</text>
  <text class="code" x="534" y="204">open: 'popover'</text>
  <text class="detail" x="534" y="230">跳过入口与 showDelay</text>
  <path class="flow" d="M186 244 V262 H360 V282"/>
  <path class="flow" d="M534 244 V262 H360"/>

  <rect class="step" x="160" y="284" width="400" height="70" rx="12"/>
  <text class="label" x="360" y="314">输入浮层打开并聚焦</text>
  <text class="detail" x="360" y="341">上下文准备期间可编辑，暂不能发送</text>
  <path class="flow" d="M360 354 V382"/>

  <rect x="36" y="384" width="648" height="158" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="label" x="360" y="418">准备上下文</text>
  <rect class="branch" x="58" y="440" width="130" height="74" rx="10"/>
  <text class="code" x="123" y="469">base</text>
  <text class="detail" x="123" y="497">基础字段</text>
  <rect class="branch" x="216" y="440" width="130" height="74" rx="10"/>
  <text class="code" x="281" y="469">nearby</text>
  <text class="detail" x="281" y="497">附近文本</text>
  <rect class="optional" x="374" y="440" width="130" height="74" rx="10"/>
  <text class="small-code" x="439" y="469">getContext</text>
  <text class="detail" x="439" y="497">可选业务字段</text>
  <rect class="optional" x="532" y="440" width="130" height="74" rx="10"/>
  <text class="small-code" x="597" y="469">sanitizeContext</text>
  <text class="detail" x="597" y="497">可选脱敏</text>
  <path class="flow" d="M188 477 H212"/>
  <path class="flow" d="M346 477 H370"/>
  <path class="flow" d="M504 477 H528"/>
  <path class="flow" d="M360 542 V562 H186 V586"/>
  <path class="flow" d="M360 562 H534 V586"/>

  <rect class="branch" x="36" y="588" width="300" height="110" rx="12"/>
  <text class="label" x="186" y="619">点击推荐项</text>
  <text class="detail" x="186" y="648">静态推荐 / getSuggestions</text>
  <text class="detail" x="186" y="677">点击后直接提交</text>
  <rect class="branch" x="384" y="588" width="300" height="110" rx="12"/>
  <text class="label" x="534" y="619">手动输入并发送</text>
  <text class="detail" x="534" y="648">上下文就绪即可发送</text>
  <text class="detail" x="534" y="677">无须等待远程推荐完成</text>
  <path class="flow" d="M186 698 V722 H360 V752"/>
  <path class="flow" d="M534 698 V722 H360"/>

  <rect class="step" x="100" y="754" width="520" height="88" rx="12"/>
  <text class="label" x="360" y="787">buildPrompt 构造最终问题</text>
  <text class="code" x="360" y="820">默认：suggestion?.prompt ?? query</text>
  <path class="flow" d="M360 842 V880"/>

  <rect class="optional" x="100" y="882" width="520" height="104" rx="12"/>
  <text class="label" x="360" y="915">关闭浮层</text>
  <text class="code" x="360" y="944">adapter.submit(request)</text>
  <text class="detail" x="360" y="972">交给应用已有的对话面板</text>
</svg>
