<div class="demo-workspace">
  <aside class="demo-controls" aria-label="浮窗配置">
    <section class="demo-card">
      <h2>浮窗配置</h2>
      <label class="toggle"
        ><input type="checkbox" [ngModel]="floating()" (ngModelChange)="floating.set($event)" />浮窗模式</label
      >
      <form (ngSubmit)="form.valid && apply()" #form="ngForm">
        <label
          >浮窗位置<select name="placement" [(ngModel)]="placement">
            <option value="bottom-right">右下</option>
            <option value="top-right">右上</option>
            <option value="top-left">左上</option>
            <option value="bottom-left">左下</option>
            <option value="center">居中</option>
          </select></label
        >
        <div class="demo-grid">
          <label>浮窗宽度<input name="width" type="number" [(ngModel)]="width" min="320" required /></label
          ><label>浮窗高度<input name="height" type="number" [(ngModel)]="height" min="300" required /></label
          ><label>横向偏移<input name="offsetX" type="number" [(ngModel)]="offsetX" min="0" required /></label
          ><label>纵向偏移<input name="offsetY" type="number" [(ngModel)]="offsetY" min="0" required /></label>
        </div>
        <button>应用浮窗状态</button>
      </form>
      <p class="demo-help">拖动浮窗顶部手柄可更新状态；切换模式会重建聊天，清空对话。</p>
    </section>
  </aside>
  @for (key of [floating()]; track key) {
  <demo-chat [ui]="ui()" [floatingState]="state()" (floatingStateChange)="state.set($event)" /> }
</div>
