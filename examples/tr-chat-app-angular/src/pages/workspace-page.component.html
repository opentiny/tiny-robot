      <span class="project-status">进行中</span>
      <h2>客户反馈整理</h2>

      <small>产品团队 · 本周五</small>

    <article>
      <span class="project-status">待评审</span>
      <h2>知识库建设</h2>
      <p>整理接入指南和常见问题，完善团队知识。</p>
      <small>研发团队 · 下周一</small>
    </article>
    <article>
      <span class="project-status">进行中</span>
      <h2>版本发布准备</h2>
      <p>核对发布清单，汇总测试结果和交付材料。</p>
      <small>项目团队 · 下周三</small>
    </article>
  </div>
</main>
<app-floating-assistant [runtime]="runtime" [ui]="ui" />
