<main class="app-chat" aria-label="完整聊天">
  <tr-chat id="ai-chat" [runtime]="runtime" [ui]="ui" [renderers]="renderers" [bubbleRenderers]="bubbleRenderers" />
</main>
<ng-template #replyActions let-scope>
  <div class="reply-actions">
    <button
      #copyButton
      type="button"
      class="reply-copy"
      aria-label="复制回复"
      (click)="copyReply(replyText(scope), copyButton)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="8" y="8" width="12" height="12" rx="3" />
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
      </svg>
      <span class="copy-label" aria-live="polite">复制</span>
    </button>
  </div>
</ng-template>
