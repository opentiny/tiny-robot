name: 'CI: E2E Test'

on:
  workflow_call:

jobs:
  test-job:
    name: e2e-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-${{ github.event.pull_request.head.sha || github.sha }}
          path: .

      - name: Install Playwright Browser
        run: |
          cd packages/test
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm -F tiny-robot-test test:e2e

      - name: Run Playwright Component Tests
        run: pnpm -F tiny-robot-test test:ct

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            packages/test/playwright-report/
            packages/test/component/playwright-report/
          retention-days: 13
