name: E2E 测试

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 安装 pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.15.0
        
    - name: 安装依赖
      run: pnpm install
      
    - name: 构建组件
      run: pnpm build:components
      
    - name: 安装 Playwright 浏览器
      run: |
        cd packages/test
        npx playwright install --with-deps chromium
        
    - name: 运行 E2E 测试
      run: pnpm test
      
    - name: 上传测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: packages/test/playwright-report/
        retention-days: 30
        
    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: packages/test/test-results/
        retention-days: 30