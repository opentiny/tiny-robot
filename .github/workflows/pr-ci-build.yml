name: 'CI: Build'

on:
  workflow_call:
    inputs:
      skip-playground:
        description: 'Skip playground build'
        type: boolean
        default: false

jobs:
  build-job:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Test kit
        run: pnpm -F @opentiny/tiny-robot-kit test

      - name: Build components
        run: pnpm build

      - name: Build docs
        env:
          NODE_OPTIONS: >-
            --max-old-space-size=10240
            --report-on-fatalerror
            --report-uncaught-exception
            --diagnostic-dir=${{ runner.temp }}/node-diagnostics/docs
            --heapsnapshot-near-heap-limit=1
            --heap-prof
            --heap-prof-dir=${{ runner.temp }}/node-diagnostics/docs
            --heap-prof-interval=512
          VP_MODE: production
        run: |
          mkdir -p "$RUNNER_TEMP/node-diagnostics/docs"
          set -o pipefail
          pnpm -F docs exec vitepress build 2>&1 | tee "$RUNNER_TEMP/node-diagnostics/docs/build.log"

      - name: Upload Node diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: node-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/node-diagnostics/docs
          if-no-files-found: ignore
          retention-days: 7

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packages/components/dist
            packages/kit/dist
            packages/svgs/dist
            docs/dist
            pr_number.txt
          retention-days: 1
