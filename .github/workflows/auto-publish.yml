# 工作流名称
name: Auto Publish
# 运行时显示的名称
run-name: Auto Publish

# 触发条件配置
on:
  push:
    tags:
      - 'v*'

# 定义工作流中的作业
jobs:
  build:
    # 指定运行环境为最新版本的ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.parse_tag.outputs.dist_tag }}
    steps:
      # 步骤1: 检出代码
      - name: CheckOut Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # 步骤2: 设置pnpm包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # 步骤3: 设置Node.js环境
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # 使用Node.js 24版本
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org' # 设置npm registry地址

      # 步骤4: 获取pnpm缓存目录路径
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 步骤5: 配置pnpm缓存
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          # 使用操作系统类型和依赖配置文件的哈希值作为缓存键
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤6: 安装项目依赖
      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      # 步骤7: 构建组件
      - name: Run Build Components
        run: pnpm build

      - name: Parse Publish tag
        id: parse_tag
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          if [[ "$tag_name" == *alpha* ]]; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$tag_name" == *beta* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$tag_name" == *rc* ]]; then
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify clean working directory
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working directory is not clean"
            exit 1
          fi

      - name: Verify package version match tag
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          tag_version="${tag_name#v}"

          if ! pnpm lerna list --json | \
            jq -e --arg version "$tag_version" \
            'any(.[]; .version == $version)' >/dev/null; then
            echo "No package version matches tag: $tag_name"
            exit 1
          fi

      # 步骤8: 构建文档
      - name: Build VitePress
        run: pnpm build:docs --nocomponents
        env:
          VITEPRESS_BASE: /tiny-robot/${{ steps.parse_tag.outputs.dist_tag }}/
          PLAYGROUND_BASE: /tiny-robot/${{ steps.parse_tag.outputs.dist_tag }}/playground

      - name: Verify build output
        run: ls -la ./docs/dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-dist
          path: |
            packages/components/dist
            packages/kit/dist
            packages/svgs/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install publish dependencies
        run: pnpm i --no-frozen-lockfile --ignore-scripts

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-dist
          path: ./packages

      # 步骤9: 发布组件到NPM
      - name: Publish components
        run: pnpm lerna publish from-package --pre-dist-tag ${{ needs.build.outputs.dist_tag }} --yes

  release:
    needs: [build, publish]
    if: ${{ needs.build.outputs.dist_tag == 'latest' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 步骤10: 发布组件到GitHub Release
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  deploy-docs:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download docs artifacts
        uses: actions/download-artifact@v7
        with:
          name: docs-dist
          path: ./docs/dist

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          destination_dir: ./${{ needs.build.outputs.dist_tag }}/
          keep_files: true
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
